<div class="column-wrapper" *ngIf="cards$ | async as allCards">
  <div class="column-header">
    <h3>{{ column.name }}</h3>
    <span class="card-count">{{ getCardsForColumn(allCards).length }}</span>
  </div>

  <div 
    class="column-cards"
    cdkDropList
    [id]="column.id.toString()"
    [cdkDropListData]="getCardsForColumn(allCards)"
    [cdkDropListConnectedTo]="getConnectedDropLists()"
    (cdkDropListDropped)="onCardDrop($event)"
  >
    <app-card
      *ngFor="let card of getCardsForColumn(allCards)"
      [card]="card"
      cdkDrag
      [cdkDragData]="card"
    >
    </app-card>
  </div>
</div>
