<div class="card" (click)="openCard()">
  <span class="ticket-code">{{ card.ticketCode }}</span>
  <p class="card-title">{{ card.title }}</p>

  <div class="card-footer">
    <span class="story-points">{{ card.storyPoints }} SP</span>
    <span class="criteria-count">{{ completedCount }}/{{ card.acceptanceCriteria.length }}</span>
    <div class="avatar">{{ assigneeInitials }}</div>
  </div>
</div>
