<div class="modal-overlay" *ngIf="selectedCard$ | async as card" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">

    <div class="modal-header">
      <span class="ticket-code">{{ card.ticketCode }}</span>
      <button class="close-btn" (click)="closeModal()">×</button>
    </div>

    <h2>{{ card.title }}</h2>

    <div class="modal-tags">
      <span class="status-tag">{{ card.status | formatStatus }}</span>
      <span class="points-tag">{{ card.storyPoints }} pts</span>
    </div>

    <p class="description">{{ card.description }}</p>

    <div class="modal-meta">
      <div><strong>Owner:</strong> {{ card.owner }}</div>
      <div><strong>Assignee:</strong> {{ card.assignee }}</div>
    </div>

    <div class="acceptance-criteria">
      <h4>Acceptance Criteria</h4>
      <label *ngFor="let criterion of card.acceptanceCriteria; let i = index" class="criterion">
        <input type="checkbox" [checked]="criterion.isCompleted" (click)="toggleCriterion(card.id, i)">
        <span [class.completed]="criterion.isCompleted">{{ criterion.text }}</span>
      </label>
    </div>

    <div class="modal-actions">
      <button class="btn-edit" (click)="editCard(card)">Edit</button>
      <button class="btn-delete" (click)="deleteCard(card)">Delete</button>
    </div>
  </div>
</div>
